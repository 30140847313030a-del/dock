<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>夏日刮刮樂</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    color: #17304d;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem 1rem;
    background:
      radial-gradient(circle at 14% 10%, rgba(255, 255, 255, 0.85), transparent 28%),
      radial-gradient(circle at 84% 18%, rgba(255, 220, 115, 0.65), transparent 22%),
      linear-gradient(180deg, #7ed7ff 0%, #b8edff 36%, #fff4d6 72%, #ffe0a6 100%);
    overflow-x: hidden;
  }

  #game {
    width: 100%;
    max-width: 460px;
  }

  .header {
    text-align: center;
    margin-bottom: 1.25rem;
  }

  .summer-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.72);
    color: #e67e22;
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    margin-bottom: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 16px rgba(32, 95, 128, 0.08);
  }

  .header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #0f4c75;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .header p {
    font-size: 14px;
    color: #35627d;
    line-height: 1.6;
  }

  .card {
    background: rgba(255, 255, 255, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.78);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(32, 95, 128, 0.16);
    backdrop-filter: blur(10px);
  }

  .card-header {
    background: linear-gradient(90deg, #ffd36e, #ffb86b);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-header span {
    font-size: 13px;
    font-weight: 800;
    color: #6a4300;
    letter-spacing: .05em;
  }

  .card-header small {
    font-size: 12px;
    color: #6a4300;
    opacity: .82;
  }

  .inner {
    padding: 1.25rem;
  }

  .scratch-wrap {
    margin-bottom: 1rem;
  }

  .scratch-card {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, 0.05),
      0 12px 28px rgba(15, 76, 117, 0.12);
  }

  .scratch-under {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .prize-label {
    font-size: 13px;
    font-weight: 600;
    opacity: .75;
    margin-bottom: 10px;
  }

  .prize-letter {
    font-size: 82px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 1px;
  }

  .prize-rarity {
    font-size: 15px;
    font-weight: 700;
    margin-top: 12px;
    opacity: .82;
  }

  .prize-note {
    font-size: 13px;
    margin-top: 8px;
    opacity: .68;
  }

  canvas.scratch-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
    user-select: none;
  }

  .reveal-box {
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(0, 0, 0, 0.06);
    padding: 18px;
    text-align: center;
    min-height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .reveal-placeholder {
    color: #5b7a91;
    font-size: 14px;
    line-height: 1.7;
  }

  .result-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .result-value {
    font-size: 54px;
    font-weight: 900;
    line-height: 1;
  }

  .result-rarity {
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
    opacity: .8;
  }

  .tomorrow-note {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: #4d738d;
  }

  .footer-tip {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #5b7a91;
    line-height: 1.6;
  }

  .scratch-dust {
    position: absolute;
    width: 6px;
    height: 3px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 5;
    opacity: 0.95;
    animation: dust-fade 560ms ease-out forwards;
  }

  @keyframes dust-fade {
    0% {
      transform: translate(0, 0) rotate(0deg) scale(1);
      opacity: 0.95;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) rotate(140deg) scale(0.42);
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 1.5rem 1rem;
    }

    .header h1 {
      font-size: 24px;
    }

    .prize-letter {
      font-size: 68px;
    }

    .result-value {
      font-size: 46px;
    }

    .inner {
      padding: 1rem;
    }
  }
</style>
</head>

<body>
<div id="game">

  <div class="header">
    <div class="summer-badge">
      <i class="ti ti-sun"></i>
      <span>Summer Lucky Scratch</span>
    </div>
    <h1>夏日刮刮樂</h1>
    <p>每天一次，刮開今天的夏日幸運籤！</p>
  </div>

  <div id="main-area">
    <div style="text-align:center;padding:3rem 0;color:#4d738d;">
      <i class="ti ti-loader-2" aria-hidden="true" style="font-size:30px;"></i>
      <div style="font-size:13px;margin-top:8px;">載入中…</div>
    </div>
  </div>

</div>

<script>
/* ── 物品設定 ─────────────────────────────────────────────
   id      : 顯示文字
   bg/fg   : 底色 / 文字色
   rarity  : 稀有度標籤
   lo/hi   : 對應的 z-score 區間

   機率分佈：
   a / g  各約 0.6%（極稀有）
   b / f  各約 6.1%（稀有）
   c / e  各約 24.2%（普通）
   d      約 38.3%（常見）
──────────────────────────────────────────────────────── */
const ITEMS = [
  { id:'a', bg:'#d9d2ff', fg:'#3f2a8a', rarity:'極稀有', lo:-Infinity, hi:-2.5 },
  { id:'b', bg:'#ffc4a8', fg:'#7a2f14', rarity:'稀有',   lo:-2.5, hi:-1.5 },
  { id:'c', bg:'#d9f1a6', fg:'#35610f', rarity:'普通',   lo:-1.5, hi:-0.5 },
  { id:'d', bg:'#bde7ff', fg:'#0f4c75', rarity:'常見',   lo:-0.5, hi:0.5  },
  { id:'e', bg:'#bff3df', fg:'#0b5a4a', rarity:'普通',   lo:0.5,  hi:1.5  },
  { id:'f', bg:'#ffe089', fg:'#7a5300', rarity:'稀有',   lo:1.5,  hi:2.5  },
  { id:'g', bg:'#ffd0cb', fg:'#8a2e3d', rarity:'極稀有', lo:2.5,  hi:Infinity },
];

/* ── 工具函式 ───────────────────────────────────────────── */
function boxMuller() {
  let u;
  do {
    u = Math.random();
  } while (u < 1e-10);

  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
}

function pickItem() {
  const z = boxMuller();
  return ITEMS.find(t => z >= t.lo && z < t.hi) || ITEMS[3];
}

function today() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

/* ── 每日限制：用 localStorage 儲存 ───────────────────── */
function loadState() {
  try {
    const raw = localStorage.getItem('scratch_state');
    if (!raw) return null;

    const s = JSON.parse(raw);
    if (s.date === today()) return s;
  } catch(e) {}

  return null;
}

function saveState(itemId) {
  try {
    localStorage.setItem('scratch_state', JSON.stringify({
      date: today(),
      itemId: itemId,
      playedAt: new Date().toISOString()
    }));
  } catch(e) {}
}

/* ── 初始化 ─────────────────────────────────────────────── */
function init() {
  const saved = loadState();

  if (saved) {
    const item = ITEMS.find(i => i.id === saved.itemId) || ITEMS[3];
    renderAlreadyScratched(item);
  } else {
    const item = pickItem();
    renderScratchCard(item);
  }
}

/* ── 畫面：今天尚未刮 ───────────────────────────────────── */
function renderScratchCard(item) {
  document.getElementById('main-area').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span>今日刮刮樂</span>
        <small>刮開看看你的夏日幸運籤</small>
      </div>

      <div class="inner">
        <div class="scratch-wrap">
          <div class="scratch-card" id="scratch-card"></div>
        </div>

        <div class="reveal-box" id="prize-reveal">
          <span class="reveal-placeholder">
            用手指或滑鼠刮開上方銀色區域<br>
            看看你今天抽到什麼
          </span>
        </div>

        <div class="footer-tip">每人每日限玩一次</div>
      </div>
    </div>
  `;

  createSinglePanel(item, false);
}

/* ── 畫面：今天已刮過 ───────────────────────────────────── */
function renderAlreadyScratched(item) {
  document.getElementById('main-area').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span>今日刮刮樂</span>
        <small>今天已經玩過囉</small>
      </div>

      <div class="inner">
        <div class="scratch-wrap">
          <div class="scratch-card" id="scratch-card"></div>
        </div>

        <div class="reveal-box" style="background:${item.bg};">
          <div>
            <div class="result-title" style="color:${item.fg};">你今天刮到的是</div>
            <div class="result-value" style="color:${item.fg};">${item.id.toUpperCase()}</div>
            <div class="result-rarity" style="color:${item.fg};">${item.rarity}</div>
          </div>
        </div>

        <div class="tomorrow-note">已記錄，明天再來刮一次 🌴</div>
      </div>
    </div>
  `;

  createSinglePanel(item, true);
}

/* ── 建立單一刮刮卡 ───────────────────────────────────── */
let revealed = false;

function createSinglePanel(item, preRevealed) {
  revealed = preRevealed;

  const box = document.getElementById('scratch-card');
  box.innerHTML = '';

  const under = document.createElement('div');
  under.className = 'scratch-under';
  under.style.background = `
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.68), transparent 28%),
    linear-gradient(180deg, ${item.bg}, rgba(255,255,255,0.38)),
    ${item.bg}
  `;

  under.innerHTML = `
    <div class="prize-label" style="color:${item.fg};">你的夏日幸運籤</div>
    <div class="prize-letter" style="color:${item.fg};">${item.id.toUpperCase()}</div>
    <div class="prize-rarity" style="color:${item.fg};">${item.rarity}</div>
    <div class="prize-note" style="color:${item.fg};">Summer Lucky!</div>
  `;

  box.appendChild(under);

  if (!preRevealed) {
    const cv = document.createElement('canvas');
    cv.className = 'scratch-canvas';
    box.appendChild(cv);
    initScratch(cv, item);
  }
}

/* ── 刮刮樂動畫：更接近真實刮卡感 ───────────────────── */
function initScratch(cv, item) {
  requestAnimationFrame(() => {
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);

    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.scale(dpr, dpr);

    const W = r.width;
    const H = r.height;

    drawScratchSurface(ctx, W, H);

    let scratching = false;
    let last = null;
    let moveCount = 0;

    function getPoint(e) {
      const rr = cv.getBoundingClientRect();
      return {
        x: e.clientX - rr.left,
        y: e.clientY - rr.top
      };
    }

    function startScratch(e) {
      e.preventDefault();

      scratching = true;
      last = getPoint(e);

      if (cv.setPointerCapture) {
        cv.setPointerCapture(e.pointerId);
      }

      scratchTo(ctx, last, last);
      spawnScratchDust(cv, last.x, last.y);
    }

    function moveScratch(e) {
      if (!scratching) return;

      e.preventDefault();

      const current = getPoint(e);
      scratchTo(ctx, last, current);
      spawnScratchDust(cv, current.x, current.y);

      last = current;
      moveCount++;

      if (!revealed && moveCount % 6 === 0) {
        const percent = getScratchedPercent(ctx, cv);

        if (percent > 0.42) {
          revealed = true;
          onReveal(item);

          cv.style.transition = 'opacity 520ms ease, filter 520ms ease';
          cv.style.opacity = '0';
          cv.style.filter = 'blur(0.5px)';
          cv.style.pointerEvents = 'none';

          setTimeout(() => {
            if (cv && cv.parentElement) cv.remove();
          }, 540);
        }
      }
    }

    function endScratch(e) {
      scratching = false;
      last = null;

      if (cv.releasePointerCapture && e.pointerId !== undefined) {
        cv.releasePointerCapture(e.pointerId);
      }
    }

    cv.addEventListener('pointerdown', startScratch);
    cv.addEventListener('pointermove', moveScratch);
    cv.addEventListener('pointerup', endScratch);
    cv.addEventListener('pointercancel', endScratch);
    cv.addEventListener('pointerleave', endScratch);
  });
}

function scratchTo(ctx, from, to) {
  if (!from || !to) return;

  const distance = Math.hypot(to.x - from.x, to.y - from.y);
  const brush = Math.max(24, Math.min(38, distance * 0.8));

  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (distance < 2) {
    ctx.beginPath();
    ctx.arc(to.x, to.y, brush / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.lineWidth = brush;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();

    ctx.lineWidth = brush * 0.52;
    ctx.beginPath();
    ctx.moveTo(from.x + 3, from.y - 2);
    ctx.lineTo(to.x + 3, to.y - 2);
    ctx.stroke();
  }

  ctx.restore();
}

/* ── 銀色刮刮膜表面 ───────────────────────────────────── */
function drawScratchSurface(ctx, W, H) {
  ctx.save();

  const foil = ctx.createLinearGradient(0, 0, W, H);
  foil.addColorStop(0, '#f9fbff');
  foil.addColorStop(0.16, '#b8c2cc');
  foil.addColorStop(0.34, '#eef2f6');
  foil.addColorStop(0.52, '#9da8b4');
  foil.addColorStop(0.72, '#f5f7fa');
  foil.addColorStop(1, '#a8b2bd');

  roundedRect(ctx, 0, 0, W, H, 22);
  ctx.fillStyle = foil;
  ctx.fill();

  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;

  for (let x = -W; x < W * 2; x += 18) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + W, H);
    ctx.stroke();
  }

  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#000000';

  for (let i = 0; i < 1000; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const s = Math.random() * 1.35;
    ctx.fillRect(x, y, s, s);
  }

  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#ffffff';

  for (let i = 0; i < 24; i++) {
    ctx.beginPath();
    ctx.arc(
      Math.random() * W,
      Math.random() * H,
      8 + Math.random() * 18,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '800 26px sans-serif';
  ctx.fillText('刮開驚喜', W / 2, H / 2 - 20);

  ctx.font = '600 14px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillText('Scratch to reveal', W / 2, H / 2 + 18);

  ctx.restore();
}

function roundedRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    return;
  }

  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

/* ── 計算實際刮開比例 ─────────────────────────────────── */
function getScratchedPercent(ctx, cv) {
  const pixels = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let transparent = 0;

  for (let i = 3; i < pixels.length; i += 4) {
    if (pixels[i] < 35) transparent++;
  }

  return transparent / (pixels.length / 4);
}

/* ── 刮屑效果 ─────────────────────────────────────────── */
function spawnScratchDust(cv, x, y) {
  const parent = cv.parentElement;
  if (!parent) return;

  for (let i = 0; i < 3; i++) {
    const dust = document.createElement('span');
    dust.className = 'scratch-dust';

    const dx = (Math.random() - 0.5) * 46;
    const dy = -8 - Math.random() * 30;

    dust.style.left = `${x + (Math.random() - 0.5) * 14}px`;
    dust.style.top = `${y + (Math.random() - 0.5) * 14}px`;
    dust.style.background = Math.random() > 0.5 ? '#d7dde3' : '#f8fbff';
    dust.style.setProperty('--dx', `${dx}px`);
    dust.style.setProperty('--dy', `${dy}px`);

    parent.appendChild(dust);

    setTimeout(() => {
      if (dust && dust.parentElement) dust.remove();
    }, 580);
  }
}

/* ── 揭曉獎項 ─────────────────────────────────────────── */
function onReveal(item) {
  const area = document.getElementById('prize-reveal');

  area.style.background = item.bg;
  area.style.borderColor = 'rgba(255,255,255,0.65)';
  area.innerHTML = `
    <div>
      <div class="result-title" style="color:${item.fg};">你刮到了</div>
      <div class="result-value" style="color:${item.fg};">${item.id.toUpperCase()}</div>
      <div class="result-rarity" style="color:${item.fg};">${item.rarity}</div>
    </div>
  `;

  if (item.rarity === '極稀有') {
    launchConfetti();
  }

  saveState(item.id);

  setTimeout(() => {
    if (document.querySelector('.tomorrow-note')) return;

    const note = document.createElement('div');
    note.className = 'tomorrow-note';
    note.textContent = '已記錄，明天再來刮一次 🌊';
    area.parentElement.appendChild(note);
  }, 800);
}

/* ── 彩帶特效：極稀有時觸發 ───────────────────────────── */
function launchConfetti() {
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;';
  document.body.appendChild(cv);

  const dpr = window.devicePixelRatio || 1;
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;

  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = window.innerWidth;
  const H = window.innerHeight;

  const pcs = Array.from({ length: 90 }, () => ({
    x: Math.random() * W,
    y: Math.random() * -H,
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    size: 5 + Math.random() * 7,
    color: ['#ffd36e', '#ff9f80', '#8be0ff', '#bff3df', '#d9d2ff'][Math.floor(Math.random() * 5)],
    rot: Math.random() * 360,
    vr: (Math.random() - 0.5) * 8
  }));

  let f = 0;

  function animate() {
    ctx.clearRect(0, 0, W, H);

    pcs.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    });

    if (++f < 150) {
      requestAnimationFrame(animate);
    } else {
      cv.remove();
    }
  }

  animate();
}

/* ── 啟動 ─────────────────────────────────────────────── */
init();
</script>
</body>
</html>
